[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-model-routing"
version = "0.1.0"
description = "Adaptive model escalation for rare-target detection under limited inference budgets."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pomdp", "model-routing", "rare-target-detection"]
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
